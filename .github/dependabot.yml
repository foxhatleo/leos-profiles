version: 2
updates:
  # Workflow actions are pinned to commit SHAs with a version comment; this
  # keeps both current. Container images are deliberately unpinned tags (CI
  # tests each distro's current image), so there is no docker ecosystem here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age before proposing it, so a compromised or broken tag
    # has time to be noticed and pulled upstream.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
